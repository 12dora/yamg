name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v). Used only for manual runs."
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish DMG
    runs-on: macos-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bundle_version: ${{ steps.ver.outputs.bundle_version }}
      sha256: ${{ steps.hash.outputs.sha256 }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          BUNDLE_VERSION="${VERSION%%-*}"
          if [[ "$VERSION" == *-* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle_version=${BUNDLE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Building YAMG ${VERSION} (bundle: ${BUNDLE_VERSION}, prerelease: ${IS_PRERELEASE})"

      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild \
            -project YAMG.xcodeproj \
            -scheme YAMG \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION=${{ steps.ver.outputs.bundle_version }} \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build | xcpretty || true
          test -d "build/Build/Products/Release/YAMG.app"

      - name: Re-sign ad-hoc (deep)
        run: |
          APP="build/Build/Products/Release/YAMG.app"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APP="build/Build/Products/Release/YAMG.app"
          STAGING="dist/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "YAMG ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "YAMG-${VERSION}.dmg"

      - name: Compute SHA-256
        id: hash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DMG="YAMG-${VERSION}.dmg"
          shasum -a 256 "$DMG" | tee "${DMG}.sha256"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YAMG-${{ steps.ver.outputs.version }}-dmg
          path: |
            YAMG-${{ steps.ver.outputs.version }}.dmg
            YAMG-${{ steps.ver.outputs.version }}.dmg.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.ver.outputs.is_prerelease == 'true' }}
          files: |
            YAMG-${{ steps.ver.outputs.version }}.dmg
            YAMG-${{ steps.ver.outputs.version }}.dmg.sha256
          generate_release_notes: true
          body: |
            ## Install

            **Homebrew (recommended)**

            ```bash
            brew install --cask 12dora/tap/yamg
            ```

            Homebrew strips the macOS quarantine attribute automatically — no Gatekeeper prompt.

            **Manual DMG**

            1. Download `YAMG-${{ steps.ver.outputs.version }}.dmg` below.
            2. Open the DMG, drag **YAMG** into `/Applications`.
            3. The app is ad-hoc signed but **not** notarized (no Apple Developer Program membership). Clear the quarantine flag once:
               ```bash
               xattr -dr com.apple.quarantine /Applications/YAMG.app
               ```

            ## Verification

            SHA-256 (`YAMG-${{ steps.ver.outputs.version }}.dmg`):

            ```
            ${{ steps.hash.outputs.sha256 }}
            ```

            ---
            *Based on [Mackup](https://github.com/lra/mackup) 0.10.3*

  update-tap:
    name: Update Homebrew tap
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: 12dora/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          SHA256="${{ needs.build.outputs.sha256 }}"
          cat > Casks/yamg.rb << 'CASK'
          cask "yamg" do
            version "VERSION_PLACEHOLDER"
            sha256 "SHA256_PLACEHOLDER"

            url "https://github.com/12dora/yamg/releases/download/v#{version}/YAMG-#{version}.dmg"
            name "YAMG"
            desc "Yet Another Mackup GUI for macOS"
            homepage "https://github.com/12dora/yamg"

            app "YAMG.app"

            zap trash: [
              "~/Library/Preferences/com.yamg.app.plist",
              "~/Library/Application Support/YAMG",
              "~/Library/Caches/com.yamg.app",
              "~/Library/Saved Application State/com.yamg.app.savedState",
            ]
          end
          CASK
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" Casks/yamg.rb
          sed -i "s/SHA256_PLACEHOLDER/${SHA256}/" Casks/yamg.rb
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Casks/yamg.rb

      - name: Commit and push
        run: |
          git config user.name "12dora"
          git config user.email "12dora@users.noreply.github.com"
          git add Casks/yamg.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "yamg ${{ needs.build.outputs.version }}"
          git push
