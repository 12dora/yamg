name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without leading v). Used only for manual runs."
        required: true
        default: "0.0.0-dev"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & publish DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building YAMG ${VERSION}"

      - name: Build Release (ad-hoc signed)
        run: |
          xcodebuild \
            -project YAMG.xcodeproj \
            -scheme YAMG \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            build | xcpretty || true
          # xcpretty may swallow non-zero; re-check the artifact exists
          test -d "build/Build/Products/Release/YAMG.app"

      - name: Re-sign ad-hoc (deep)
        run: |
          APP="build/Build/Products/Release/YAMG.app"
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          APP="build/Build/Products/Release/YAMG.app"
          STAGING="dist/dmg"
          mkdir -p "$STAGING"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create \
            -volname "YAMG ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "YAMG-${VERSION}.dmg"

      - name: Compute SHA-256
        id: hash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DMG="YAMG-${VERSION}.dmg"
          shasum -a 256 "$DMG" | tee "${DMG}.sha256"
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          echo "sha256=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact (always, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: YAMG-${{ steps.ver.outputs.version }}-dmg
          path: |
            YAMG-${{ steps.ver.outputs.version }}.dmg
            YAMG-${{ steps.ver.outputs.version }}.dmg.sha256
          retention-days: 14

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YAMG-${{ steps.ver.outputs.version }}.dmg
            YAMG-${{ steps.ver.outputs.version }}.dmg.sha256
          generate_release_notes: true
          body: |
            ## Install

            **Homebrew (recommended)**

            ```bash
            brew install --cask 12dora/tap/yamg
            ```

            Homebrew strips the macOS quarantine attribute automatically — no Gatekeeper prompt.

            **Manual DMG**

            1. Download `YAMG-${{ steps.ver.outputs.version }}.dmg` below.
            2. Open the DMG, drag **YAMG** into `/Applications`.
            3. The app is ad-hoc signed but **not** notarized (no Apple Developer Program membership). Clear the quarantine flag once:
               ```bash
               xattr -dr com.apple.quarantine /Applications/YAMG.app
               ```

            ## Verification

            SHA-256 (`YAMG-${{ steps.ver.outputs.version }}.dmg`):

            ```
            ${{ steps.hash.outputs.sha256 }}
            ```
