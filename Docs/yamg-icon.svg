<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7AA8FF"/>
      <stop offset="0.55" stop-color="#4A7AE8"/>
      <stop offset="1" stop-color="#2E54C4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8EEFB"/>
    </linearGradient>
    <linearGradient id="paperBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D5E0F5"/>
      <stop offset="1" stop-color="#B8C8E8"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFCF5C"/>
      <stop offset="1" stop-color="#F39220"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background; macOS 26 applies its own squircle mask -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="36" rx="580" ry="220" fill="#FFFFFF" opacity="0.08"/>

  <!-- Back file -->
  <g transform="translate(346 245) rotate(-6 235 300)">
    <rect x="0" y="0" width="470" height="600" rx="40" fill="url(#paperBack)"/>
  </g>

  <!-- Front file -->
  <g transform="translate(310 290) rotate(4 235 300)">
    <rect x="0" y="0" width="470" height="600" rx="40" fill="url(#paper)"/>
    <rect x="65" y="87" width="254" height="18" rx="9" fill="#2E54C4"/>
    <rect x="65" y="131" width="163" height="11" rx="5.5" fill="#B8C8E8"/>
    <rect x="65" y="196" width="25" height="25" rx="5" fill="#4A7AE8"/>
    <rect x="109" y="202" width="218" height="14" rx="7" fill="#7A8CB0"/>
    <rect x="65" y="250" width="25" height="25" rx="5" fill="#4A7AE8"/>
    <rect x="109" y="256" width="272" height="14" rx="7" fill="#7A8CB0"/>
    <rect x="65" y="304" width="25" height="25" rx="5" fill="#4A7AE8"/>
    <rect x="109" y="310" width="181" height="14" rx="7" fill="#7A8CB0"/>
    <rect x="65" y="358" width="25" height="25" rx="5" fill="#4A7AE8" opacity="0.5"/>
    <rect x="109" y="364" width="236" height="14" rx="7" fill="#B8C8E8"/>
    <rect x="65" y="412" width="25" height="25" rx="5" fill="#4A7AE8" opacity="0.5"/>
    <rect x="109" y="418" width="200" height="14" rx="7" fill="#B8C8E8"/>
  </g>

  <!-- Sync ring emblem -->
  <g transform="translate(745 727)">
    <ellipse cx="0" cy="167" rx="167" ry="18" fill="#000000" opacity="0.18"/>
    <circle cx="0" cy="0" r="167" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="167" fill="url(#ring)" opacity="0.12"/>

    <!-- Top arc -->
    <path d="M -79.24 -28.83 A 84.33 84.33 0 0 1 79.24 -28.83"
          fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 53.87 -50.13 L 79.24 -28.83 L 84.99 -61.43"
          fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Bottom arc -->
    <path d="M 79.24 28.83 A 84.33 84.33 0 0 1 -79.24 28.83"
          fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round"/>
    <path d="M -53.87 50.13 L -79.24 28.83 L -84.99 61.43"
          fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
